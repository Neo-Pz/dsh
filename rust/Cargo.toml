[package]
name = "iflow-identity"
version = "0.1.0"
edition = "2021"
description = "iFlow identity root: zero-chain did:key agent identities (M1)"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.5"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sealing a message so a relay can carry it without reading it (envelope.rs).
# curve25519-dalek already arrives transitively via ed25519-dalek; it is named
# explicitly because envelope.rs uses it directly, to map an Ed25519 public key
# onto the Montgomery form X25519 wants.
curve25519-dalek = "4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"

[[bin]]
name = "iflow-id"
path = "src/main.rs"
