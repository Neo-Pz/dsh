[package]
name = "iflow-identity"
version = "0.1.0"
edition = "2021"
description = "iFlow identity root: zero-chain did:key agent identities (M1)"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.5"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "iflow-id"
path = "src/main.rs"
