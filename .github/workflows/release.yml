name: release

# Build the Rust `iflow-id` identity binary for the three OSes on every tag
# push (v*) and attach it to the matching GitHub Release. This is what lets a
# user get a prebuilt binary with "one-click install" instead of building Rust.
on:
  push:
    tags: ['v*']
  # Cutting a Release is the only way the binary reaches users, so it must be
  # possible to rebuild one without inventing a version.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bin: iflow-id.exe
            asset: iflow-id-windows-amd64.exe
          - os: ubuntu-latest
            bin: iflow-id
            asset: iflow-id-linux-amd64
          - os: macos-latest
            bin: iflow-id
            asset: iflow-id-darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build iflow-id (release)
        working-directory: rust
        shell: bash
        run: |
          # The repo's rust/.cargo/config.toml pins HTTP_PROXY to 127.0.0.1 for the
          # author's machine; CI has no such proxy, so drop that line and let cargo
          # reach crates.io directly. Sed available on all three runner OSes.
          if [ -f .cargo/config.toml ]; then sed -i.bak '/proxy/d' .cargo/config.toml; fi
          cargo build --release
      # The Release once shipped a binary older than the plugin that calls it:
      # `show --json` did not exist yet, the old build answered with its human
      # format, the plugin's JSON parse failed, and every node that installed it
      # journaled UNSIGNED without saying why. Prove the interface here, where
      # the failure is one red job instead of a silently degraded network.
      - name: Verify the binary answers the interface the plugin calls
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/release/${{ matrix.bin }}"
          HOME_DIR="$(mktemp -d)"
          "$BIN" --home "$HOME_DIR" create ci-smoke-test
          OUT="$("$BIN" --home "$HOME_DIR" show --json)"
          echo "$OUT"
          node -e '
            const parsed = JSON.parse(process.argv[1])
            if (typeof parsed.did !== "string" || !parsed.did.startsWith("did:key:")) {
              throw new Error("show --json must return a did:key, got: " + process.argv[1])
            }
          ' "$OUT"
          echo "ok: show --json returns a did:key"

      - name: Rename binary to platform asset name
        working-directory: rust
        shell: bash
        run: cp target/release/${{ matrix.bin }} ${{ matrix.asset }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: rust/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
